[build-system]
# 77 is the first setuptools that understands a PEP 639 SPDX license expression.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memdex-mcp"  # PyPI name; the package, CLI and MCP server are all "memdex"
version = "0.3.6"
description = "Zero-dependency shared memory for AI coding agents: content-hash file summaries, symbol map, notes and handoffs over MCP."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "ai", "agent", "memory", "claude", "codex", "context", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ChoYugyeong/memdex"
Repository = "https://github.com/ChoYugyeong/memdex"
Source = "https://github.com/ChoYugyeong/memdex"
Changelog = "https://github.com/ChoYugyeong/memdex/blob/master/CHANGELOG.md"
Issues = "https://github.com/ChoYugyeong/memdex/issues"

[project.scripts]
memdex = "memdex.cli:main"

[tool.setuptools]
packages = ["memdex"]

