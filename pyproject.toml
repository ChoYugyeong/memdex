[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memdex-mcp"  # PyPI name; the package, CLI and MCP server are all "memdex"
version = "0.3.1"
description = "Zero-dependency shared memory for AI coding agents: content-hash file summaries, symbol map, notes and handoffs over MCP."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "ai", "agent", "memory", "claude", "codex", "context", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
    "Environment :: Console",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ChoYugyeong/memdex"
Issues = "https://github.com/ChoYugyeong/memdex/issues"

[project.scripts]
memdex = "memdex.cli:main"

[tool.setuptools]
packages = ["memdex"]

