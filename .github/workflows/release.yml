name: Release

# Publishes to PyPI with Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on PyPI: add a trusted publisher for project "memdex-mcp" with
# owner ChoYugyeong, repository memdex, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # publish an existing tag: gh workflow run release.yml --ref master -f tag=v0.1.0
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.0"
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches pyproject.toml
        run: |
          python - "${{ inputs.tag || github.ref_name }}" <<'EOF'
          import re, sys, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = sys.argv[1].lstrip("v")
          sys.exit(0 if tag == version else f"tag {tag} != pyproject version {version}")
          EOF
      - name: Run tests
        run: python -m unittest discover tests
      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/memdex-mcp/
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
